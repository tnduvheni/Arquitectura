<style>
:root{--bg:#dedbd5;--fg:#1d1d1b;--panel:rgba(255,255,255,.8);--bd:rgba(0,0,0,.14);--acc:#1d1d1b;--accfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1a;--fg:#f0eee9;--panel:rgba(34,34,32,.82);--bd:rgba(255,255,255,.18);--acc:#f0eee9;--accfg:#1c1c1a}}
:root[data-theme="dark"]{--bg:#1c1c1a;--fg:#f0eee9;--panel:rgba(34,34,32,.82);--bd:rgba(255,255,255,.18);--acc:#f0eee9;--accfg:#1c1c1a}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;touch-action:none;cursor:grab}#c:active{cursor:grabbing}
.ui{position:fixed;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:2;pointer-events:none}
.top{top:calc(12px + env(safe-area-inset-top,0px))}.bot{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.card{pointer-events:auto;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;backdrop-filter:blur(8px);font-size:13px}
.card b{font-size:14px;display:block}.card span{opacity:.7}
button{pointer-events:auto;font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(8px)}
button.on{background:var(--acc);color:var(--accfg)}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.42));z-index:1}#grain{position:fixed;inset:0;pointer-events:none;opacity:.08;mix-blend-mode:overlay;z-index:1}</style></head><body>
